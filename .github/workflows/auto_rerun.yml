name: Auto Rerun

on:
  workflow_run:
    workflows: ["VPS Tailscale"] # Укажите точное название вашего основного workflow из поля `name:`
    types:
      - completed

jobs:
  rerun:
      # Срабатывает, если прошлый запуск завершился с ошибкой (failure) или был отменен (cancelled)
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Rerun workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Перезапускает упавший/отмененный раун автоматически
          gh run rerun ${{ github.event.workflow_run.id }} --failed
